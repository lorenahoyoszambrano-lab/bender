<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bender–Koppitz: puntuación</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--bd:#ddd9cf;--ac:#2f5d8a;--acbg:#e3edf6;--em:#8a3b2f;--embg:#f7e6e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#ecebe6;--mut:#a09f98;--bd:#3a3935;--ac:#8bb7e0;--acbg:#25394d;--em:#e7a395;--embg:#4a2a24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#ecebe6;--mut:#a09f98;--bd:#3a3935;--ac:#8bb7e0;--acbg:#25394d;--em:#e7a395;--embg:#4a2a24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:1.4rem;margin:.4rem 0 .2rem}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.fig{margin:18px 0 6px;font-weight:700;color:var(--ac);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.item.on{border-color:var(--ac);background:var(--acbg)}
.em .item.on{border-color:var(--em);background:var(--embg)}
label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--ac)}
.em input{accent-color:var(--em)}
.t{font-weight:600}
.n{color:var(--mut);font-weight:400}
details{margin:6px 0 0 32px;font-size:.88rem;color:var(--mut)}
summary{cursor:pointer}
.sb{margin-top:6px;padding-left:0}
.hint{font-size:.8rem;color:var(--mut);margin:4px 0 0 32px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:1.25rem;font-weight:700}
.eq{font-size:.9rem;color:var(--mut)}
button.r{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.box input[type=text],.box input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.row{display:grid;grid-template-columns:2fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}
tr.cur td{background:var(--acbg);font-weight:700}
.wrap{overflow-x:auto}
#rep{line-height:1.55;font-size:.95rem}#rep h3{margin:14px 0 4px;font-size:1rem;color:var(--ac)}#rep h2{margin:0 0 6px;font-size:1.15rem}#rep li{margin:2px 0}.small{font-size:.8rem;color:var(--mut)}
</style></head><body><main>
<h1>Bender–Koppitz: hoja de puntuación</h1>
<p class="sub">Marca cada error o indicador presente: cada marca vale 1 punto. Los reactivos con a) y b) puntúan 1 punto aunque marques ambos.</p>
<div class="box"><div class="row"><input type="text" id="nom" placeholder="Nombre del evaluado"><input type="number" id="edad" placeholder="Edad (años)" min="3" max="15" step="0.5"></div></div>
<div class="tabs"><button id="tm" class="on">Maduración (25)</button><button id="te">Emocionales (10)</button><button id="tr">Informe</button></div>
<section id="pm"></section>
<section id="pe" class="em" hidden></section>
<section id="pr" hidden></section>
<div class="box wrap" id="tab"></div>
</main>
<div class="bar"><div><span class="big" id="tot"></span><span class="eq" id="eq"></span><button class="r" id="rs">Reiniciar</button></div></div>
<script>
const M=[
["Figura A",[
{n:1,s:[["a","Distorsión de la forma","Cuadrado o círculo muy achatados o deformados (un eje el doble del otro); adición u omisión de ángulos. En caso de duda, no computar."],["b","Desproporción","Un componente (cuadrado o círculo) es el doble de grande que el otro."]]},
{n:2,t:"Rotación",d:"Rotación de la figura o parte de ella de 45° o más; también si se rota la tarjeta aunque luego copie bien."},
{n:3,t:"Integración",d:"Falla al unir círculo y cuadrado: separación de más de 3 mm en el vértice adyacente; también aplica a la sobreposición."}]],
["Figura 1",[
{n:4,t:"Distorsión de la forma",d:"Cinco o más puntos convertidos en círculos (puntos agrandados o círculos parcialmente rellenos no cuentan; rayas no se puntúan). En caso de duda, no computar."},
{n:5,t:"Rotación",d:"Rotación de la figura de 45° o más; o rotación de la tarjeta aunque luego copie bien."},
{n:6,t:"Perseveración",d:"Más de 15 puntos en una hilera."}]],
["Figura 2",[
{n:7,t:"Rotación",d:"Rotación de la figura de 45° o más; o rotación de la tarjeta."},
{n:8,t:"Integración",d:"Omisión de una o dos hileras de círculos; hilera de la Fig. 1 usada como tercera hilera de la Fig. 2; cuatro o más círculos en la mayoría de las columnas; adición de una hilera."},
{n:9,t:"Perseveración",d:"Más de 14 columnas de círculos en una hilera."}]],
["Figura 3",[
{n:10,t:"Distorsión de la forma",d:"Cinco o más puntos convertidos en círculos (agrandados o parcialmente rellenos no cuentan; rayas no se puntúan). En duda, no computar."},
{n:11,t:"Rotación",d:"Rotación del eje de la figura de 45° o más; o rotación de la tarjeta."},
{n:12,s:[["a","Integración","No logra el aumento de cada hilera sucesiva de puntos; «cabeza de flecha» irreconocible o invertida; conglomeración de puntos; sólo una hilera. Borroneo o número incorrecto de puntos no se computa."],["b","Línea continua","La línea sustituye a los puntos o se agrega a ellos."]]}]],
["Figura 4",[
{n:13,t:"Rotación",d:"Rotación de la figura o parte de ella de 45° o más; o rotación de la tarjeta."},
{n:14,t:"Integración",d:"Separación de más de 3 mm entre la curva y el ángulo adyacente; igual para la superposición. La curva toca ambas esquinas."}]],
["Figura 5",[
{n:15,t:"Modificación",d:"Cinco o más puntos convertidos en círculos (agrandados o parcialmente rellenos no cuentan; rayas no se puntúan)."},
{n:16,t:"Rotación",d:"Rotación de la figura total de 45° o más; rotación de la extensión (apunta a la izquierda o parte a la izquierda del punto central del arco). Se puntúa una sola vez."},
{n:17,s:[["a","Desintegración","Conglomeración de puntos; línea recta o círculo de puntos en lugar de arco; la extensión atraviesa el arco. Ángulos y cuadrados no se puntúan."],["b","Línea continua","Línea continua en lugar de puntos en el arco, la extensión o ambos."]]}]],
["Figura 6",[
{n:18,s:[["a","Curvas por ángulos","Tres o más curvas sustituidas por ángulos (en duda, no computar)."],["b","Líneas rectas","Ninguna curva en una o ambas hileras; líneas rectas."]]},
{n:19,t:"Integración",d:"Las dos líneas no se cruzan o se cruzan en un extremo de una o ambas; dos líneas onduladas entrelazadas."},
{n:20,t:"Perseveración",d:"Seis o más curvas sinusoidales completas en cualquiera de las dos direcciones."}]],
["Figura 7",[
{n:21,s:[["a","Desproporción de tamaño","Un hexágono es por lo menos el doble de grande que el otro."],["b","Deformación excesiva","Adición u omisión de ángulos en uno o ambos hexágonos."]]},
{n:22,t:"Rotación",d:"Rotación de la figura o parte de ella de 45° o más; o rotación del estímulo."},
{n:23,t:"Integración",d:"Los hexágonos no se superponen, o lo hacen excesivamente (uno penetra completamente en el otro)."}]],
["Figura 8",[
{n:24,t:"Distorsión de la forma",d:"Hexágono o rombo excesivamente deformados; ángulos agregados u omitidos."},
{n:25,t:"Rotación",d:"Rotación de la figura de 45° o más; o rotación del estímulo (girar la hoja para aprovechar el papel no se computa, pero se registra)."}]]];
const E=[
["Orden confuso","Figuras desparramadas sin secuencia lógica. Cualquier orden lógico es positivo. No se computa si la Fig. 8 queda arriba por falta de espacio.","Planeamiento pobre, dificultad para organizar el material, confusión mental. Común entre los 5 y 7 años."],
["Línea ondulada","Dos o más cambios abruptos de dirección (mínimo dos puntos o círculos consecutivos) en Fig. 1 y 2. Se puntúa una vez.","Inestabilidad en la coordinación motora y en la personalidad; factores orgánicos y/o emocionales."],
["Círculos sustituidos por rayas (Fig. 2)","Al menos la mitad de los círculos reemplazados por rayas de 2 mm o más. Los puntos no cuentan.","Impulsividad, falta de interés o atención; preocupación por problemas o evitación."],
["Aumento progresivo de tamaño (Figs. 1, 2 y 3)","Puntos y círculos crecen hasta que los últimos son al menos 3 veces mayores que los primeros. Se computa una vez.","Baja tolerancia a la frustración y explosividad."],
["Gran tamaño","Uno o más dibujos un tercio más grandes en ambas direcciones que el modelo (en figuras de dos partes, ambas agrandadas). Una sola vez.","Acting out."],
["Tamaño pequeño","Uno o más dibujos a la mitad del modelo en ambas direcciones (en figuras de dos partes, ambas reducidas). Una sola vez.","Ansiedad, conducta retraída, constricción, timidez."],
["Línea fina","Trazo tan fino que cuesta ver el dibujo completo.","Timidez y retraimiento en niños pequeños."],
["Repaso del dibujo o de los trazos","Dibujo total o parcial repasado o deformado con líneas espesas e impulsivas (o borrado y redibujado). Una sola vez.","Impulsividad y agresividad; frecuente en acting out."],
["Segunda tentativa","Se abandona un dibujo antes de terminarlo y se rehace en otro lugar de la hoja (si se borra y se rehace en el mismo lugar, no cuenta).","Impulsividad y ansiedad; también niños muy ansiosos que asocian significados a la forma (p. ej., Fig. 6)."],
["Expansión","Se usan dos o más hojas para las nueve figuras (o el reverso de la hoja).","Impulsividad y acting out en niños pequeños; en escolares, casi sólo en perturbación emocional y lesión neurológica."]];
const T=[[0,1,"10 años o más"],[2,2,"9 a 10 años"],[3,3,"8½ a 9 años"],[4,4,"8 a 8½ años"],[5,5,"7 a 8 años"],[6,7,"6½ a 7 años"],[8,8,"6 a 6½ años"],[9,10,"5½ a 6 años"],[11,25,"Más de 10 errores (ver nota)"]];
const $=id=>document.getElementById(id);
const st={m:new Set(),e:new Set()};let tab="m";
const KEY={};
function build(){
 let h="";
 M.forEach(([f,its])=>{h+=`<div class="fig">${f}</div>`;
  its.forEach(it=>{
   if(it.s){h+=`<div class="item" id="i${it.n}"><div class="t">${it.n}. <span class="n">(1 punto máx.)</span></div>`;
    it.s.forEach(([k,t,d])=>{h+=`<label style="margin-top:6px"><input type="checkbox" data-m="${it.n}" data-k="${k}"><span><span class="t">${it.n}${k}) ${t}</span><br><span class="n" style="font-size:.88rem">${d}</span></span></label>`});
    h+=`</div>`}
   else h+=`<div class="item" id="i${it.n}"><label><input type="checkbox" data-m="${it.n}"><span class="t">${it.n}. ${it.t}</span></label><details><summary>Criterio</summary>${it.d}</details></div>`;
  })});
 $("pm").innerHTML=h;
 $("pe").innerHTML=E.map((e,i)=>`<div class="item" id="e${i}"><label><input type="checkbox" data-e="${i}"><span class="t">${["I","II","III","IV","V","VI","VII","VIII","IX","X"][i]}. ${e[0]}</span></label><details><summary>Definición e implicaciones</summary><p><b>Definición:</b> ${e[1]}</p><p><b>Implicaciones:</b> ${e[2]}</p></details></div>`).join("");
 document.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=upd);
}
function upd(){
 const mm={};
 document.querySelectorAll("[data-m]").forEach(c=>{if(c.checked)mm[c.dataset.m]=1});
 for(let n=1;n<=25;n++)$("i"+n).classList.toggle("on",!!mm[n]);
 const ee=[];
 document.querySelectorAll("[data-e]").forEach(c=>{const on=c.checked;$("e"+c.dataset.e).classList.toggle("on",on);if(on)ee.push(1)});
 st.mc=Object.keys(mm).length;st.ec=ee.length;render();
}
function render(){
 $("tab").hidden=tab==="r";
 if(tab==="r"){$("tot").textContent="Informe clínico";$("eq").textContent=` · Maduración ${st.mc||0}/25 · Emocionales ${st.ec||0}/10`;return}
 if(tab==="m"){const p=st.mc||0;const r=T.find(x=>p>=x[0]&&p<=x[1]);
  $("tot").textContent=`Maduración: ${p} / 25`;$("eq").textContent=" · Equivale a: "+(r?r[2]:"");
  $("tab").innerHTML=`<b>Equivalencia puntaje → edad</b><table><tr><th>Puntos</th><th>Edad de maduración</th></tr>${T.map(x=>`<tr class="${r===x?"cur":""}"><td>${x[0]===x[1]?x[0]:x[1]===25?x[0]+" o más":x[0]+"–"+x[1]}</td><td>${x[2]}</td></tr>`).join("")}</table><p class="n" style="font-size:.8rem">Tabla según el material ingresado. Los rangos extremos (0 y 11 o más puntos) conviene verificarlos con tu manual de Koppitz.</p>`;
 }else{
  $("tot").textContent=`Indicadores emocionales: ${st.ec||0} / 10`;$("eq").textContent="";
  $("tab").innerHTML=`<p class="n" style="font-size:.88rem;margin:0">Koppitz sugiere considerar significativo un conjunto de 3 o más indicadores. La interpretación debe integrarse con el resto de la evaluación.</p>`;
 }
}
function show(t){tab=t;$("pm").hidden=t!=="m";$("pe").hidden=t!=="e";$("pr").hidden=t!=="r";$("tm").classList.toggle("on",t==="m");$("te").classList.toggle("on",t==="e");$("tr").classList.toggle("on",t==="r");render();window.scrollTo(0,0)}
$("tm").onclick=()=>show("m");$("te").onclick=()=>show("e");$("tr").onclick=()=>show("r");
$("rs").onclick=()=>{document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);upd()};
// [categoría, figura, reactivo, nivel (1=significativo*, 2=altamente significativo**), edad mínima (significativo si edad > valor)]
const R=[
["Adición u omisión de ángulos","Figura A","1a",1,null],["Adición u omisión de ángulos","Figura 7","21b",1,null],["Adición u omisión de ángulos","Figura 8","24",1,6],
["Sustitución de curvas por ángulos","Figura 6","18a",1,null],["Ausencia de curvas (líneas rectas)","Figura 6","18b",2,null],
["Desproporción de partes","Figura A","1b",1,6],["Desproporción de partes","Figura 7","21a",1,7],
["Sustitución de cinco puntos por círculos","Figura 1","4",1,null],["Sustitución de cinco puntos por círculos","Figura 3","10",1,6],["Sustitución de cinco puntos por círculos","Figura 5","15",1,8],
["Rotación de 45°","Figura 1","5",2,null],["Rotación de 45°","Figura 4","13",2,null],["Rotación de 45°","Figura 8","25",2,null],["Rotación de 45°","Figura A","2",1,null],["Rotación de 45°","Figura 5","16",1,null],["Rotación de 45°","Figura 7","22",1,6],["Rotación de 45°","Figura 3","11",1,7],["Rotación de 45°","Figura 2","7",1,8],
["Integración de las partes no lograda","Figura A","3",1,null],["Integración de las partes no lograda","Figura 4","14",1,null],["Integración de las partes no lograda","Figura 3","12a",1,4],["Integración de las partes no lograda","Figura 6","19",1,null],["Integración de las partes no lograda","Figura 7","23",1,6],
["Omisión o adición de hilera de círculos","Figura 2","8",2,6],
["Serie de puntos sustituida por líneas","Figura 3","12b",2,null],["Serie de puntos sustituida por líneas","Figura 5","17b",2,null],
["Perseveración","Figura 1","6",2,7],["Perseveración","Figura 2","9",2,7],["Perseveración","Figura 6","20",2,7]];
const AG=[[10,99],[9,10],[8.5,9],[8,8.5],[7,8],[6.5,7],[6,6.5],[5.5,6],[0,5.5]];
const chk=(n,k)=>{const c=document.querySelector('[data-m="'+n+'"]'+(k?'[data-k="'+k+'"]':''));return !!(c&&c.checked)};
function gen(){
 const age=parseFloat($("edad").value),nom=$("nom").value||"—",p=st.mc||0;
 const r=T.find(x=>p>=x[0]&&p<=x[1]),ag=AG[T.indexOf(r)];
 let mat;
 if(isNaN(age))mat="No se ingresó la edad cronológica, por lo que no es posible compararla con la edad de maduración.";
 else if(age>ag[1])mat=`La edad cronológica (${age} años) es superior a la edad de maduración obtenida: el nivel de maduración neuromotriz se ubica <b>por debajo</b> de lo esperado para su edad.`;
 else if(age<ag[0])mat=`La edad cronológica (${age} años) es inferior a la edad de maduración obtenida: el nivel de maduración neuromotriz se ubica <b>por encima</b> de lo esperado.`;
 else mat=`La edad cronológica (${age} años) coincide con la edad de maduración obtenida: el nivel de maduración neuromotriz es <b>acorde</b> a su edad.`;
 const hit=[],amb=[],pend=[];
 R.forEach(([cat,fig,it,lv,mn])=>{const m=it.match(/^(\d+)([ab])?$/);if(!chk(m[1],m[2]))return;const o={cat,fig,it,lv};
  if(mn===null||(!isNaN(age)&&age>mn))hit.push(o);else if(isNaN(age))pend.push(o);else amb.push(o)});
 const li=o=>`<li>${o.cat}, ${o.fig} (reactivo ${o.it}): ${o.lv===2?"altamente significativo**":"significativo*"}</li>`;
 const alt=hit.filter(o=>o.lv===2).length;
 let lc=hit.length?`<p>Se observan <b>${hit.length}</b> indicador(es) de lesión cerebral (${alt} altamente significativo(s)):</p><ul>${hit.map(li).join("")}</ul>`:"<p>No se observan indicadores de lesión cerebral con significación para la edad del evaluado.</p>";
 if(amb.length)lc+=`<p>Presentes pero <b>no concluyentes a esta edad</b> (son comunes también en niños sin lesión cerebral):</p><ul>${amb.map(o=>`<li>${o.cat}, ${o.fig} (reactivo ${o.it})</li>`).join("")}</ul>`;
 if(pend.length)lc+=`<p><b>Falta la edad cronológica</b> para valorar: ${pend.map(o=>o.cat+", "+o.fig).join("; ")}.</p>`;
 const em=[];document.querySelectorAll("[data-e]").forEach(c=>{if(c.checked)em.push(+c.dataset.e)});
 const emh=em.length?`<p>Se observan <b>${em.length}</b> de 10 indicadores emocionales:</p><ul>${em.map(i=>`<li><b>${E[i][0]}</b>: ${E[i][2]}</li>`).join("")}</ul>`:"<p>No se observan indicadores emocionales.</p>";
 let con=hit.length?`Los resultados muestran ${hit.length} indicador(es) de lesión cerebral para la edad del evaluado${alt?`, ${alt} de ellos altamente significativo(s)`:""}, por lo que se sugiere descartar compromiso neurológico mediante evaluación complementaria.`:"No se observan indicadores de lesión cerebral con significación para su edad.";
 con+=` Maduración visomotora ${isNaN(age)?"sin comparar con la edad cronológica":age>ag[1]?"por debajo de lo esperado":age<ag[0]?"por encima de lo esperado":"acorde a la edad"}; ${em.length?em.length+" indicador(es) emocional(es)":"sin indicadores emocionales"}.`;
 const w=(!isNaN(age)&&(age<5||age>10))?'<p class="small">Nota: los indicadores de lesión cerebral están descritos para niños de 5 a 10 años.</p>':"";
 $("rep").innerHTML=`<h2>Informe clínico: Test Gestáltico Visomotor de Bender (Koppitz)</h2><p><b>Evaluado:</b> ${nom} &nbsp; <b>Edad:</b> ${isNaN(age)?"—":age+" años"} &nbsp; <b>Fecha:</b> ${new Date().toLocaleDateString("es")}</p>${w}<h3>1. Maduración visomotora</h3><p>Puntaje de maduración: <b>${p}</b> / 25. Edad de maduración equivalente: <b>${r?r[2]:"—"}</b>.</p><p>${mat}</p><h3>2. Indicadores de lesión cerebral</h3>${lc}<h3>3. Indicadores emocionales</h3>${emh}<h3>4. Conclusión</h3><p>${con}</p><p class="small">*Significativo: se da más a menudo, pero no exclusivamente, en el grupo con lesión cerebral. **Altamente significativo: se da casi exclusivamente en el grupo con lesión cerebral. Los indicadores orientan, pero no establecen por sí solos un diagnóstico.</p>`;
}
$("pr").innerHTML='<div class="box"><button class="r" id="gen">Generar informe</button> <button class="r" id="cp">Copiar</button><p class="small" style="margin:8px 0 0">El informe se puede editar directamente antes de copiarlo.</p></div><div class="box" id="rep" contenteditable="true">Marca los reactivos, ingresa la edad y pulsa «Generar informe».</div>';
$("gen").onclick=gen;
$("cp").onclick=()=>{const g=document.createRange();g.selectNodeContents($("rep"));const s=getSelection();s.removeAllRanges();s.addRange(g);try{document.execCommand("copy");$("cp").textContent="¡Copiado!"}catch(e){$("cp").textContent="Selecciona y copia"}setTimeout(()=>$("cp").textContent="Copiar",1500)};
build();upd();
</script></body></html>
